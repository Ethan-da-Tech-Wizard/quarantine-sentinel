<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 508" width="860" height="508">
  <defs>
    <style>
      .terminal-bg { fill: #181825; }
      .terminal-header { fill: #11111b; }
      .terminal-title { fill: #a6adc8; font-family: monospace, monospace; font-size: 13px; font-weight: bold; text-anchor: middle; }
      .terminal-text { fill: #cdd6f4; font-family: monospace, monospace; font-size: 13px; }
      .btn-red { fill: #f38ba8; }
      .btn-yellow { fill: #f9e2af; }
      .btn-green { fill: #a6e3a1; }
    </style>
  </defs>
  <rect class="terminal-bg" x="0" y="0" width="860" height="508" rx="10" ry="10" />
  <path class="terminal-header" d="M 0 10 A 10 10 0 0 1 10 0 L 850 0 A 10 10 0 0 1 860 10 L 860 42 L 0 42 Z" />
  <circle class="btn-red" cx="24" cy="21" r="6" />
  <circle class="btn-yellow" cx="42" cy="21" r="6" />
  <circle class="btn-green" cx="60" cy="21" r="6" />
  <text class="terminal-title" x="430" y="26">Quarantine Sentinel: Automated Vault Isolation &amp; Audit Receipt</text>
  <g class="terminal-text">
    <text x="24" y="80">$ python3 -m sentinel quarantine ~/Downloads/suspicious_invoice.pdf</text>
    <text x="24" y="102">🛡️  Quarantine Sentinel: Isolating Untrusted Payloads</text>
    <text x="24" y="124">Vault Directory: ~/.local/share/sentinel/vault</text>
    <text x="24" y="146">==============================================================================</text>
    <text x="24" y="168">[QUARANTINED] ~/Downloads/suspicious_invoice.pdf</text>
    <text x="24" y="190">  → Quarantine ID        : Q-20261122-010738-3a6eb079</text>
    <text x="24" y="212">  → Permissions Defused  : 0o755 -&gt; 0o000 (Execution Disabled)</text>
    <text x="24" y="234">  → Audit Receipt Issued : ~/.local/share/sentinel/vault/receipt.json</text>
    <text x="24" y="256">  → Cryptographic SHA256 : 2dd5ddcb5e542cc6109f26a934c93491c2b1350ca3800b992c34635ead3b0daa</text>
    <text x="24" y="278">------------------------------------------------------------------------------</text>
    <text x="24" y="300">Quarantine completed. 1 file(s) safely isolated into vault.</text>
    <text x="24" y="322"></text>
    <text x="24" y="344">$ python3 -m sentinel verify</text>
    <text x="24" y="366">🔒 Quarantine Vault Integrity Audit</text>
    <text x="24" y="388">==============================================================================</text>
    <text x="24" y="410">[PASS: VALID] Q-20261122-010738-3a6eb079</text>
    <text x="24" y="432">  • Receipt Signature Integrity : PASS</text>
    <text x="24" y="454">  • Payload SHA-256 Match       : PASS</text>
    <text x="24" y="476">✓ All vault records and payloads passed cryptographic integrity checks.</text>
  </g>
</svg>
