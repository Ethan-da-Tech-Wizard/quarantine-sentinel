[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quarantine-sentinel"
version = "1.0.0"
description = "Zero-dependency offline file security scanner and automated quarantine sentinel for isolating disguised binaries, double extensions, and malicious downloads."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Ethan Kilmer", email = "ethan@twu.software" }
]
keywords = [
    "security",
    "quarantine",
    "malware-analysis",
    "incident-response",
    "dfir",
    "forensics",
    "file-integrity",
    "devsecops",
    "zero-dependency",
    "posix-security",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "Topic :: Security",
    "Topic :: System :: Systems Administration",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
dependencies = []

[project.scripts]
sentinel = "sentinel.cli:main"

[project.urls]
Homepage = "https://github.com/Ethan-da-Tech-Wizard/quarantine-sentinel"
Repository = "https://github.com/Ethan-da-Tech-Wizard/quarantine-sentinel"
Issues = "https://github.com/Ethan-da-Tech-Wizard/quarantine-sentinel/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["sentinel*"]
